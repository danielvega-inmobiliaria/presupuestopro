{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="pp2">
  <div style="max-width:440px;margin:0 auto">
    <div style="font-weight:700;font-size:19px;margin-bottom:2px"><i class="bi bi-key"></i> Cambiar contraseña</div>
    <p class="ayuda" style="padding:0 0 12px">Para la cuenta <strong>{{ user.email }}</strong></p>

    <div class="bloque">
      <div class="bloque-cuerpo">
        <form method="POST">
          <div class="campo">
            <label>Contraseña actual</label>
            <input type="password" name="actual" required autofocus>
          </div>
          <div class="campo">
            <label>Contraseña nueva</label>
            <input type="password" name="password" required minlength="6">
          </div>
          <div class="campo">
            <label>Repetir contraseña nueva</label>
            <input type="password" name="password2" required minlength="6">
          </div>
          <div style="display:flex;gap:10px;margin-top:4px">
            <button type="submit" class="btn2 btn2-1">
              <i class="bi bi-floppy"></i> Guardar
            </button>
            <a href="{{ url_for('dashboard.index') }}" class="btn2 btn2-2">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
