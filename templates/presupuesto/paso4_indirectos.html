{% extends 'base.html' %}
{% block title %}Indirectos — Paso 4{% endblock %}

{% block content %}
<div class="pp2 pp2-con-barra">
{% include 'presupuesto/_wizard_steps.html' with context %}

<form method="post" id="formInd" data-wizard-form>
  <div class="bloque">
    <div class="bloque-cuerpo">
      <div class="grupo-tit primero">Costos indirectos</div>
      <div class="trio">
        <div class="campo" style="margin:0">
          <label>Movilidad</label>
          <div class="sufijo"><input class="n" type="number" name="movilidad" id="movilidad" min="0" step="1000" placeholder="0"
                 value="{{ p.get('indirectos', {}).get('movilidad', '') or '' }}"><span>$</span></div>
        </div>
        <div class="campo" style="margin:0">
          <label>Alquiler andamios</label>
          <div class="sufijo"><input class="n" type="number" name="andamios" id="andamios" min="0" step="1000" placeholder="0"
                 value="{{ p.get('indirectos', {}).get('andamios', '') or '' }}"><span>$</span></div>
        </div>
        <div class="campo" style="margin:0">
          <label>Alquiler herramientas</label>
          <div class="sufijo"><input class="n" type="number" name="herramientas" id="herramientas" min="0" step="1000" placeholder="0"
                 value="{{ p.get('indirectos', {}).get('herramientas', '') or '' }}"><span>$</span></div>
        </div>
      </div>

      <!-- Indirectos adicionales dinámicos -->
      <div id="extras-container"></div>
      <button type="button" class="btn2-fant" style="margin-top:8px" onclick="agregarIndirecto()">＋ Agregar costo indirecto</button>
    </div>
  </div>
</form>

<div class="barra-tot">
  <a href="{{ url_for('presupuesto.subcontratos') }}" onclick="return wizardGoto(this.getAttribute('href'))" class="btn2 btn2-back"><i class="bi bi-arrow-left"></i></a>
  <div class="bt-txt"><div class="bt-lbl">Paso 4 de 8</div><div style="font-size:14px;color:#C3CBD9">Indirectos</div></div>
  <button type="submit" form="formInd" class="btn2 btn2-1">Siguiente <i class="bi bi-arrow-right"></i></button>
</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const SIM = '{{ simbolo }}';
let extraIdx = 0;

function agregarIndirecto(){
  const n = extraIdx++;
  const div = document.createElement('div');
  div.className = 'duo';
  div.style.marginTop = '10px';
  div.innerHTML = `
    <div class="campo" style="margin:0">
      <input type="text" name="extra_${n}_nombre" placeholder="Descripción del costo">
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div class="sufijo" style="flex:1"><input class="n" type="number" name="extra_${n}_monto" min="0" step="1000" placeholder="0"><span>$</span></div>
      <button type="button" class="btn2 btn2-2" style="min-height:48px;color:var(--rojo);border-color:var(--rojo)" onclick="this.closest('.duo').remove()"><i class="bi bi-trash"></i></button>
    </div>`;
  document.getElementById('extras-container').appendChild(div);
}
</script>
{% endblock %}
