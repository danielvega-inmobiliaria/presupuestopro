{% extends 'base.html' %}
{% block title %}{{ 'Editar' if u else 'Nuevo' }} usuario — Admin{% endblock %}

{% block content %}
<div class="pp2">
  <div class="bloque" style="max-width:600px;margin:0 auto">
    <div class="bloque-hd"><i class="bi bi-person-gear"></i>
      {{ 'Editar usuario: ' + (u.email if u else '') if u else 'Nuevo usuario' }}
    </div>
    <div class="bloque-cuerpo">
      <form method="post">
        <div class="campo">
          <label>Email <span class="req">*</span></label>
          <input type="email" name="email"
                 value="{{ u.email if u else '' }}" {{ 'readonly' if u else 'required' }}>
        </div>
        <div class="campo">
          <label>Nombre</label>
          <input type="text" name="nombre"
                 value="{{ u.nombre if u else '' }}">
        </div>
        <div class="campo">
          <label>Teléfono / WhatsApp</label>
          <input type="tel" name="telefono" placeholder="Ej: 1134567890"
                 value="{{ u.telefono if u else '' }}">
        </div>
        <div class="duo">
          <div class="campo">
            <label>Ciudad</label>
            <input type="text" name="ciudad" placeholder="Ej: Buenos Aires"
                   value="{{ u.ciudad if u else '' }}">
          </div>
          <div class="campo">
            <label>Provincia / Zona</label>
            <input type="text" name="provincia" placeholder="Ej: CABA"
                   value="{{ u.provincia if u else '' }}">
          </div>
        </div>
        <div class="campo">
          <label>País</label>
          <select name="pais">
            {% for cod, info in [('AR','Argentina'),('CL','Chile'),('UY','Uruguay'),('BR','Brasil'),('PY','Paraguay')] %}
            <option value="{{ cod }}" {{ 'selected' if (u and u.pais == cod) else '' }}>{{ info }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="campo">
          <label>{{ 'Nueva contraseña (dejar vacío para no cambiar)' if u else 'Contraseña *' }}</label>
          <input type="password" name="password"
                 {{ '' if u else 'required' }}>
        </div>
        <div class="campo">
          <label>Suscripción vence</label>
          <input type="date" name="subscription_expires"
                 value="{{ u.subscription_expires if u else (now_date + timedelta(days=30)).strftime('%Y-%m-%d') }}">
        </div>
        {% if u %}
        <div class="campo" style="display:flex;align-items:center;gap:9px">
          <input type="checkbox" name="active" id="chkActive" style="width:22px;height:22px;accent-color:var(--verde)"
                 {{ 'checked' if u.active else '' }}>
          <label for="chkActive" style="margin:0;text-transform:none;font-size:14.5px;font-weight:500;color:var(--tinta)">Usuario activo</label>
        </div>
        {% endif %}

        <div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px">
          <a href="{{ url_for('admin.usuarios') }}" class="btn2 btn2-2">
            <i class="bi bi-arrow-left"></i> Volver
          </a>
          <button type="submit" class="btn2 btn2-1">
            <i class="bi bi-save"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
