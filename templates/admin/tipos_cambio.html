{% extends 'base.html' %}
{% block title %}Tipos de cambio — Admin{% endblock %}

{% block content %}
<div class="pp2">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
    <div style="font-weight:700;font-size:19px"><i class="bi bi-currency-exchange"></i> Tipos de cambio (USD → moneda local)</div>
    <a href="{{ url_for('admin.tipos_cambio_fetch') }}" class="btn2 btn2-ok">
      <i class="bi bi-cloud-download"></i> Actualizar desde la web
    </a>
  </div>

  <div class="bloque" style="max-width:500px;margin:0 auto">
    <div class="bloque-cuerpo">
      <form method="post">
        {% for tc in tcs %}
        <div class="campo sufijo">
          <label>{{ tc.nombre_pais }} ({{ tc.pais }}) — {{ tc.moneda }}</label>
          <input type="number" name="tasa_{{ tc.pais }}" class="n"
                 value="{{ '%.2f'|format(tc.tasa) }}" step="0.01" min="0">
          <span>{{ tc.simbolo }}</span>
          <div class="pista">1 USD · Actualizado: {{ tc.updated_at[:10] if tc.updated_at else '—' }}</div>
        </div>
        {% endfor %}
        <button type="submit" class="btn2 btn2-1" style="width:100%;margin-top:6px">
          <i class="bi bi-save"></i> Actualizar tipos de cambio
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
